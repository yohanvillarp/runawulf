---
# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-lint/main/src/ansiblelint/schemas/ansible.json#/$defs/tasks
# ==============================================================================
# Ansible Role Tasks: runawulf_node
# ==============================================================================

- name: "Install prerequisite system packages"
  ansible.builtin.apt:
    name:
      - nftables
      - libbpf-dev
      - bpftool
      - ca-certificates
      - curl
      - jq
    state: present
    update_cache: true

- name: "Ensure runawulf system group exists"
  ansible.builtin.group:
    name: "{{ runawulf_group }}"
    system: true
    state: present

- name: "Ensure unprivileged runawulf system user exists (Invariant I1)"
  ansible.builtin.user:
    name: "{{ runawulf_user }}"
    group: "{{ runawulf_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: "Create Runawulf configuration directory"
  ansible.builtin.file:
    path: "{{ runawulf_config_dir }}"
    state: directory
    owner: root
    group: "{{ runawulf_group }}"
    mode: "0750"

- name: "Create Runawulf state and log directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ runawulf_user }}"
    group: "{{ runawulf_group }}"
    mode: "0750"
  loop:
    - "{{ runawulf_state_dir }}"
    - "{{ runawulf_log_dir }}"

- name: "Check if cryptographic audit key exists"
  ansible.builtin.stat:
    path: "{{ runawulf_config_dir }}/audit.key"
  register: audit_key_file

- name: "Generate cryptographic audit key if missing (Invariant I6)"
  ansible.builtin.shell: "openssl rand -hex 32 > {{ runawulf_config_dir }}/audit.key"
  when: not audit_key_file.stat.exists
  changed_when: true

- name: "Enforce strict root-only permissions on audit key (Invariant I6)"
  ansible.builtin.file:
    path: "{{ runawulf_config_dir }}/audit.key"
    owner: root
    group: root
    mode: "0400"

- name: "Deploy privileged-policy.yaml (Invariant I3)"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../config/privileged-policy.default.yaml"
    dest: "{{ runawulf_config_dir }}/privileged-policy.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart runawulf-helper

- name: "Deploy runawulf.yaml configuration template"
  ansible.builtin.template:
    src: runawulf.yaml.j2
    dest: "{{ runawulf_config_dir }}/runawulf.yaml"
    owner: root
    group: "{{ runawulf_group }}"
    mode: "0640"
  notify: Restart runawulfd

- name: "Deploy systemd unit files"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../systemd/{{ item }}"
    dest: "{{ runawulf_systemd_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - runawulf-helper.socket
    - runawulf-helper.service
    - runawulfd.service
    - runawulf-sensor.service
    - runawulf-ai.service
  notify: Reload systemd

- name: "Ensure table inet runawulf exists in nftables (Invariant I4)"
  ansible.builtin.command: nft add table inet runawulf
  register: nft_table_result
  failed_when: false
  changed_when: nft_table_result.rc == 0

- name: "Flush handlers to trigger daemon-reload before starting services"
  ansible.builtin.meta: flush_handlers

- name: "Enable and start systemd socket and daemon services"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - runawulf-helper.socket
    - runawulfd.service
