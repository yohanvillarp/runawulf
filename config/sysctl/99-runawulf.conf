# ==============================================================================
# Runawulf — Linux Kernel Hardening Parameters
# Location: /etc/sysctl.d/99-runawulf.conf
# ==============================================================================

# Enable eBPF JIT compiler for high performance
net.core.bpf_jit_enable = 1

# Harden eBPF JIT compiler against constant blinding attacks (2 = all users)
net.core.bpf_jit_harden = 2

# Disable unprivileged eBPF (only CAP_BPF / root may load programs)
kernel.unprivileged_bpf_disabled = 1

# Increase max buffer size for high-throughput packet processing
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Restrict dmesg access to users with CAP_SYSLOG
kernel.dmesg_restrict = 1

# Protect against SYN flood attacks at TCP stack level
net.ipv4.tcp_syncookies = 1
