name: "Runawulf CI Pipeline"

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'sec/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-gate:
    name: "Quality Gates, Types & Linters"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify YAML Syntax & Mappings
        run: npm run lint:yaml

      - name: Verify File Length & Modularity Limits
        run: npm run lint:lengths

      - name: TypeScript Typecheck (All Workspaces)
        run: npm run typecheck

      - name: Lint Workspace Packages
        run: npm run lint

      - name: Unit & Invariant Tests
        run: npm run test

      - name: Build TypeScript Packages & Web UI
        run: npm run build

  ebpf-toolchain:
    name: "Kernel eBPF CO-RE Probes"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Clang, LLVM & Libbpf
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-14 llvm-14 libbpf-dev linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" bpftool || true
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 100 || true
          sudo update-alternatives --install /usr/bin/llvm-strip llvm-strip /usr/bin/llvm-strip-14 100 || true

      - name: Compile eBPF Objects
        run: make bpf
