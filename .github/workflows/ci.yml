name: "Runawulf CI Pipeline"

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'sec/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-gate:
    name: "Quality Gates, Types & Modularity"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify File Length & Modularity Limits
        run: npm run lint:lengths

      - name: TypeScript Typecheck (All Workspaces)
        run: npm run typecheck

      - name: Lint Workspace Packages
        run: npm run lint

      - name: Unit & Invariant Tests
        run: npm run test
