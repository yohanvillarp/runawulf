name: "🛡️ Security Vulnerability Report"
description: "Confidential report for vulnerabilities violating the 10 Immutable Security Invariants (I1-I10)"
title: "[SECURITY]: "
labels: ["security", "critical"]
body:
  - type: markdown
    attributes:
      value: |
        ### ⚠️ Responsible Security Disclosure
        If you have discovered a potential security vulnerability, **DO NOT** disclose it publicly.
        Please review our [SECURITY.md](../../SECURITY.md) guidelines.
  - type: checkboxes
    id: violated_invariants
    attributes:
      label: Which Immutable Security Invariant is potentially affected?
      description: "Select all that apply based on [AGENTS.md](../../AGENTS.md)"
      options:
        - label: "I1: Unprivileged Web Gateway (runawulfd runs with ZERO capabilities)"
        - label: "I2: No Arbitrary Command Execution (execFile only, no shell strings)"
        - label: "I3: Zero-Trust Privileged Helper (independent root policy)"
        - label: "I4: Exclusive nftables Scope (strictly inside table inet runawulf)"
        - label: "I5: Root-Owned Rollback Watchdog (30s timer inside helper)"
        - label: "I6: Cryptographic Audit Ledger (HMAC-SHA256 signature chain)"
        - label: "I7: Idempotent Automations (duplicated alerts are NOOP)"
        - label: "I8: Strictly Declarative Modules (.rwmod files)"
        - label: "I9: Untrusted External Inputs (Zod + buffer bounds)"
        - label: "I10: Privilege Escalation Containment (AI/web compromise != root)"
  - type: textarea
    id: vulnerability_description
    attributes:
      label: Vulnerability Description & Impact
      description: "Explain the threat model, attack vector, and potential impact."
    validations:
      required: true
  - type: textarea
    id: poc
    attributes:
      label: Proof of Concept (PoC)
      description: "Safe, reproducible steps to verify the vulnerability."
    validations:
      required: true
  - type: textarea
    id: proposed_fix
    attributes:
      label: Proposed Remediation (Optional)
      description: "Any suggested patch or policy hardening."
