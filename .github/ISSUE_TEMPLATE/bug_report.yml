name: "🐛 Bug Report"
description: "Report an unexpected error, defect, or unexpected behavior in Runawulf"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in **Runawulf**!
        Please fill out this form with as much detail as possible.
  - type: input
    id: environment_os
    attributes:
      label: Target OS & Distribution
      description: "e.g., Ubuntu 22.04 LTS, Ubuntu 24.04 LTS, Debian 12"
      placeholder: "Ubuntu 22.04.4 LTS"
    validations:
      required: true
  - type: input
    id: kernel_version
    attributes:
      label: Linux Kernel Version (`uname -r`)
      description: "Run `uname -r` in terminal"
      placeholder: "5.15.0-105-generic"
    validations:
      required: true
  - type: input
    id: systemd_version
    attributes:
      label: Systemd Version (`systemctl --version`)
      placeholder: "systemd 249 (249.11-0ubuntu3.12)"
    validations:
      required: true
  - type: dropdown
    id: active_posture
    attributes:
      label: Active Posture Mode
      description: "What posture was Runawulf in when the defect occurred?"
      options:
        - "ᛉ GUARDIAN (Baseline Telemetry & Observability)"
        - "ᛟ WATCHER (Suricata Active Monitoring & Anomaly Triage)"
        - "ᛏ LOCKDOWN (Strict Isolation & Automated Quarantine)"
        - "Unknown / Startup Phase"
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: "How can we reliably reproduce this issue?"
      placeholder: |
        1. Start runawulfd via `systemctl start runawulfd`
        2. Open cockpit at `https://localhost:4000`
        3. Switch posture to Lockdown
        4. See error in journald logs
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: logs_or_evidence
    attributes:
      label: Relevant Logs & Audit Traces
      description: "Output from `journalctl -u runawulfd -n 50` or `runawulfctl status`"
      render: shell
